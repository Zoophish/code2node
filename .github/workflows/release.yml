name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package the VS Code extension
        working-directory: vscode-nodes
        run: |
          mkdir -p ../dist
          version=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository \
            -o "../dist/blender-nodes-dsl-$version.vsix"

      - name: Package the Blender extension
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('extension/blender_manifest.toml','rb'))['version'])")
          mkdir -p dist
          cp -r code2node extension/code2node
          cp LICENSE extension/LICENSE
          cd extension
          zip -r -q "../dist/code2node-$version.zip" . -x '*__pycache__*' '*.pyc'

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
