name: vsix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-nodes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.v.outputs.version }}" ]; then
            echo "tag $tag does not match package.json ${{ steps.v.outputs.version }}"
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository

      - uses: actions/upload-artifact@v4
        with:
          name: blender-nodes-dsl-${{ steps.v.outputs.version }}
          path: vscode-nodes/*.vsix

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="blender-nodes-dsl-${{ steps.v.outputs.version }}.vsix"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$vsix" --clobber
